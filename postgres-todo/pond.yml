version: 1
name: todo-app
build: Dockerfile
image: ghcr.io/pondplatform/sample-postgres-todo

ingress:
  enabled: true

service:
  port: 3000

dependencies:
  myDb:
    type: postgres
    version: 17

env:
  ENVIRONMENT: "testing"

configs:
  .env:
    format: .env
    mountPath: /usr/src/app/.env
    values:
      DB_HOST: "{{myDb.host}}"
      DB_USER: "{{myDb.username}}"
      DB_PASSWORD: "{{myDb.password}}"
      DB_DATABASE: "{{myDb.database}}"
      DB_PORT: "{{myDb.port}}"
